name: Performance metrics sync

# Recomputes the HubSpot-sourced Performance (Monthly Data) metrics for every
# linked client from each company's her_journey_org_data file. Runs outside
# the Worker because those files can be tens of MB each — see the docstring
# in scripts/sync_org_data.py. Only the trailing 3 months are rewritten each
# day, which is enough to pick up late-arriving sessions.
on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync Performance metrics
        env:
          HUBSPOT_API_TOKEN: ${{ secrets.HUBSPOT_API_TOKEN }}
          # The project URL isn't sensitive (only the service-role key is), so it
          # can live under Actions *variables* instead of secrets; either works.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/sync_org_data.py --all --months 3
